<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%2367e8f9'/%3E%3Cstop offset='100%25' stop-color='%23a78bfa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M8 20.5c2.2-3.4 4.1-5.1 5.8-5.1 1.7 0 2.6 1.4 4.2 1.4 1.6 0 3-1.2 6-4.8' fill='none' stroke='%23132029' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='11' cy='11' r='2' fill='%23132029'/%3E%3C/svg%3E"
    />
    <title>Nagisalake 控制台</title>
    <script>
      // Prevent theme FOUC: apply the stored theme before the React app
      // mounts so a system-light + local-dark user does not flash light.
      try {
        var t = localStorage.getItem('nagisalake.theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
