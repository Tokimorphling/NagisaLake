[package]
name = "nagisalake-loadgen"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
nagisalake-protocol = { workspace = true }
nagisalake-transport = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
axum = { workspace = true, features = ["http1", "json", "tokio"] }

[[bin]]
name = "nagisalake-loadgen"
path = "src/main.rs"
