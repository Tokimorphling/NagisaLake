[package]
name = "nagisalake-hub"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Off by default so `cargo build`, `cargo test` and `cargo clippy` never depend
# on a Node toolchain. Enable it to compile web/dist into the binary.
default = []
embed-web = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["http1", "json", "matched-path", "query", "tokio", "tower-log", "tracing", "ws"] }
clap = { workspace = true }
data-encoding = { workspace = true }
faststr = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["form", "json", "rustls"] }
mime_guess = { version = "2", default-features = false, optional = true }
rust-embed = { workspace = true, optional = true }
nagisalake-core = { workspace = true }
nagisalake-hub-auth = { workspace = true }
nagisalake-hub-store = { workspace = true }
nagisalake-object-store = { workspace = true }
nagisalake-protocol = { workspace = true }
nagisalake-transport = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = "0.7"
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
nagisalake-comfyui = { workspace = true }
nagisalake-worker = { workspace = true }
nagisalake-workflow = { workspace = true }
reqwest = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots"] }
tempfile = "3"
