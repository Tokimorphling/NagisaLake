[package]
name = "nagisalake-worker"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3", "dep:tracing-subscriber"]

[dependencies]
nagisalake-comfyui = { workspace = true }
nagisalake-core = { workspace = true }
nagisalake-journal = { workspace = true }
nagisalake-protocol = { workspace = true }
nagisalake-runtime = { workspace = true }
nagisalake-transport = { workspace = true }
nagisalake-workflow = { workspace = true }
pyo3 = { workspace = true, optional = true }
serde = { workspace = true }
service-async = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
